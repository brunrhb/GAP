<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #B8B8B8;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  *, *::before, *::after { box-sizing: border-box; }

  /* ── Le document ──
     Les cadres vivent en px NATIFS du format (1080×1350, 2480×3508…) dans .v2-doc,
     réduit à l'écran par un transform: scale(var(--z)). Le texte est donc mis en page
     exactement comme dans l'export, quelle que soit la taille de la fenêtre.
     L'interface posée sur les cadres (poignées, barre, contours) est contre-réduite
     avec --u = 1px écran, pour garder une taille constante à l'écran. */
  .v2-doc {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0;
    pointer-events: none;
    z-index: 3;
    --u: calc(1px / var(--z, 1));
  }
  .v2-doc > .v2-frame { pointer-events: auto; }
  .v2-frame { position: absolute; box-sizing: border-box; }
  /* contour d'édition : dessiné en dehors du flux, il ne touche jamais la mise en page du texte */
  .v2-frame::after {
    content: "";
    position: absolute;
    inset: calc(-3 * var(--u, 1px));
    border: calc(1 * var(--u, 1px)) dashed rgba(0,0,0,0.25);
    pointer-events: none;
    transition: border-color 0.12s;
  }
  .v2-frame[data-selected="false"]:hover::after { border-color: rgba(0,0,0,0.45); }
  .v2-frame[data-selected="true"]::after {
    border: calc(1 * var(--u, 1px)) solid #2D7CF0;
    box-shadow: 0 0 0 calc(1 * var(--u, 1px)) rgba(45,124,240,0.18);
  }
  /* text going past the page edge = cut in the export */
  .v2-frame[data-overflow="true"]::after { border-color: rgba(230,115,0,0.95); border-style: dashed; }
  .v2-frame[data-overflow="true"] .v2-frame-drag > span::after { content: " · coupé à l'export"; color: rgb(214,104,0); text-transform: none; }
  .v2-frame-content {
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 16px;
    color: #1a1a1a;
    outline: none;
    resize: none;
    overflow: hidden;
    -webkit-user-select: text;
    cursor: text;
  }
  .v2-frame-drag {
    position: absolute;
    top: calc(-28 * var(--u, 1px)); left: calc(-3 * var(--u, 1px)); right: calc(-3 * var(--u, 1px));
    height: calc(24 * var(--u, 1px));
    background: rgba(0,0,0,0);
    cursor: move;
    display: flex;
    align-items: center;
    padding: 0 calc(6 * var(--u, 1px));
    font-size: calc(10 * var(--u, 1px));
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    color: rgba(0,0,0,0.4);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .v2-frame-drag button {
    width: calc(16 * var(--u, 1px)) !important; height: calc(16 * var(--u, 1px)) !important;
    font-size: calc(11 * var(--u, 1px)) !important; border-radius: calc(3 * var(--u, 1px)) !important;
  }
  .v2-frame[data-selected="true"] .v2-frame-drag,
  .v2-frame:hover .v2-frame-drag { opacity: 1; }
  .v2-frame-handle {
    position: absolute;
    right: calc(-8 * var(--u, 1px)); bottom: calc(-8 * var(--u, 1px));
    width: calc(12 * var(--u, 1px)); height: calc(12 * var(--u, 1px));
    background: #fff;
    border: calc(1 * var(--u, 1px)) solid #2D7CF0;
    cursor: nwse-resize;
    opacity: 0;
  }
  .v2-frame[data-selected="true"] .v2-frame-handle { opacity: 1; }
  .v2-frame-handle-l, .v2-frame-handle-r, .v2-frame-handle-t, .v2-frame-handle-b {
    position: absolute;
    background: #fff;
    border: calc(1 * var(--u, 1px)) solid #2D7CF0;
    width: calc(8 * var(--u, 1px)); height: calc(8 * var(--u, 1px));
    opacity: 0;
  }
  .v2-frame[data-selected="true"] .v2-frame-handle-l,
  .v2-frame[data-selected="true"] .v2-frame-handle-r,
  .v2-frame[data-selected="true"] .v2-frame-handle-t,
  .v2-frame[data-selected="true"] .v2-frame-handle-b { opacity: 1; }
  .v2-frame-handle-l { left: calc(-7 * var(--u, 1px)); top: 50%; margin-top: calc(-4 * var(--u, 1px)); cursor: ew-resize; }
  .v2-frame-handle-r { right: calc(-7 * var(--u, 1px)); top: 50%; margin-top: calc(-4 * var(--u, 1px)); cursor: ew-resize; }
  .v2-frame-handle-t { left: 50%; top: calc(-7 * var(--u, 1px)); margin-left: calc(-4 * var(--u, 1px)); cursor: ns-resize; }
  .v2-frame-handle-b { left: 50%; bottom: calc(-7 * var(--u, 1px)); margin-left: calc(-4 * var(--u, 1px)); cursor: ns-resize; }

  /* contenteditable paragraph — AUCUN padding / bordure : la boîte du texte = la boîte du cadre,
     comme dans l'export (le contour est le ::after du cadre). */
  div.v2-editable {
    width: 100%; height: 100%;
    padding: 0; margin: 0;
    background: transparent;
    border: none;
    color: #1a1a1a;
    outline: none; overflow: visible;
    cursor: text;
    white-space: pre-wrap; word-break: break-word;
    box-sizing: border-box;
    -webkit-user-select: text;
  }
  div.v2-editable:empty::before {
    content: attr(data-placeholder);
    color: rgba(0,0,0,0.28);
    pointer-events: none;
    display: block;
  }
  /* inline A-pont */
  .v2-inline-bridge {
    display: inline-block;
    position: relative;
    vertical-align: baseline;
    cursor: default;
    user-select: none; -webkit-user-select: none;
  }
  .v2-bridge-ext-handle {
    position: absolute;
    right: calc(-3 * var(--u, 1px)); top: 15%; height: 70%; width: calc(7 * var(--u, 1px));
    background: #2D7CF0; border-radius: calc(2 * var(--u, 1px));
    cursor: ew-resize; opacity: 0;
    transition: opacity 0.15s;
  }
  .v2-inline-bridge:hover .v2-bridge-ext-handle { opacity: 0.85; }

  /* move handle (mobile drag affordance) */
  .v2-move-handle {
    position: absolute;
    top: calc(-36 * var(--u, 1px)); left: 50%; transform: translateX(-50%);
    width: calc(44 * var(--u, 1px)); height: calc(32 * var(--u, 1px));
    background: #1a1a1a;
    border-radius: calc(6 * var(--u, 1px));
    display: flex; align-items: center; justify-content: center;
    cursor: grab; touch-action: none;
    opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
    z-index: 10;
  }
  .v2-move-handle svg { width: calc(16 * var(--u, 1px)); height: calc(10 * var(--u, 1px)); }
  .v2-frame[data-selected="true"] .v2-move-handle {
    opacity: 1; pointer-events: auto;
  }
  .v2-move-handle:active { cursor: grabbing; background: #333; }

  /* ── RESPONSIVE ── */

  /* Small desktop ≤ 1100px: slim the right panel */
  .v2-right-panel.is-collapsed { width: 42px !important; }

  /* Tablet / large phone landscape ≤ 820px:
     panel becomes a horizontal bottom bar */
  @media (max-width: 820px) {
    .v2-body { flex-direction: column !important; }
    .v2-canvas-area { flex: 1 !important; min-height: 0 !important; }
    .v2-right-panel {
      position: static !important;
      inset: auto !important;
      box-shadow: none !important;
      width: 100% !important;
      height: 160px !important;
      flex-direction: row !important;
      border-left: none !important;
      border-top: 1px solid rgba(0,0,0,0.12) !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
    }
    /* the panel's content (tabs + scroll) sits in a wrapper: lay it out as a row too,
       otherwise the scroll area is pushed below the screen */
    .v2-panel-inner { flex-direction: row !important; min-width: 0 !important; }
    .v2-tab-strip {
      padding-left: 0 !important;
      padding-top: 40px !important;
      flex-direction: column !important;
      border-bottom: none !important;
      border-right: 1px solid rgba(0,0,0,0.10) !important;
      width: 44px !important;
      flex-shrink: 0 !important;
      height: 100% !important;
      overflow: hidden !important;
    }
    .v2-tab-strip button {
      writing-mode: vertical-rl !important;
      text-orientation: mixed !important;
      height: 50% !important;
      width: 44px !important;
      padding: 8px 4px !important;
      border-bottom: none !important;
      border-right: 2px solid transparent !important;
      margin: 0 !important;
    }
    .v2-panel-scroll {
      flex: 1 !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;          /* the panels are tall single blocks: scroll them */
      height: 160px !important;
      display: block !important;
      padding: 10px 12px !important;
      -webkit-overflow-scrolling: touch !important;
    }
    .v2-panel-scroll::-webkit-scrollbar { display: none; }
    .v2-panel-scroll > div { flex-shrink: 0 !important; }
  }

  /* Phone portrait ≤ 500px */
  @media (max-width: 500px) {
    .v2-toolbar { flex-wrap: wrap !important; gap: 4px !important; padding: 6px 8px !important; }
    .v2-toolbar .v2-hide-mobile { display: none !important; }
    .v2-right-panel { height: 140px !important; }
    .v2-panel-scroll { height: 140px !important; }
  }
</style>
</helmet>

<div style="position: fixed; inset: 0; display: flex; flex-direction: column; background: #B8B8B8; font-size: 13px;">

  <!-- toolbar -->
  <div class="v2-toolbar" style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.55); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(0,0,0,0.08); flex-shrink: 0;">
    <button onClick="{{ addParagraph }}" style="display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 28px; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #1a1a1a; font-size: 12px; font-family: inherit; cursor: pointer; border-radius: 3px;">
      <span style="font-size: 14px; line-height: 1;">+</span>
      Paragraph
    </button>
    <button onClick="{{ undo }}" title="{{ undoTitle }}" disabled="{{ undoDisabled }}" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: {{ undoDisabled ? 'rgba(0,0,0,0.25)' : '#1a1a1a' }}; font-size: 15px; line-height: 1; font-family: inherit; cursor: {{ undoDisabled ? 'default' : 'pointer' }}; border-radius: 3px;">↶</button>
    <div style="width: 1px; height: 18px; background: rgba(0,0,0,0.12);"></div>

    <!-- format selector -->
    <select value="{{ format }}" onChange="{{ onFormatChange }}" style="height: 28px; padding: 0 24px 0 8px; border: 1px solid rgba(0,0,0,0.15); background: #fff; color: #1a1a1a; font-size: 12px; font-family: inherit; cursor: pointer; border-radius: 3px; outline: none; appearance: none; -webkit-appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22 viewBox=%220 0 10 6%22><path d=%22M0 0l5 6 5-6z%22 fill=%22%23888%22/></svg>'); background-repeat: no-repeat; background-position: right 8px center;">
      <option value="ig-post">IG Post · 4:5</option>
      <option value="ig-square">IG Carré · 1:1</option>
      <option value="ig-story">Story · 9:16</option>
      <option value="li-post">LinkedIn · 1.9:1</option>
      <option value="li-portrait">LI Portrait · 4:5</option>
      <option value="affiche-a4">Affiche A4</option>
      <option value="affiche-a3">Affiche A3</option>
      <option value="affiche-land">A3 Paysage</option>
      <option value="carre-40">Carré 40×40 cm</option>
    </select>

    <div style="width: 1px; height: 18px; background: rgba(0,0,0,0.12);"></div>
    <span class="v2-hide-mobile" style="font-size: 11px; color: rgba(0,0,0,0.5);">{{ frameCount }} frame(s)</span>

    <sc-if value="{{ hasSafeZone }}" hint-placeholder-val="{{ false }}">
      <div style="width: 1px; height: 18px; background: rgba(0,0,0,0.12);"></div>
      <button onClick="{{ toggleSafeZone }}" style="display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; height: 28px; border: 1px solid rgba(0,0,0,0.15); background: {{ showSafeZone ? '#1a1a1a' : '#fff' }}; color: {{ showSafeZone ? '#fff' : '#1a1a1a' }}; font-size: 11px; font-family: inherit; cursor: pointer; border-radius: 3px; letter-spacing: 0.04em;">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
          <rect x="1" y="1" width="8" height="8" rx="1" stroke-dasharray="2 1.5"/>
        </svg>
        Safe zone
      </button>
    </sc-if>
    <div style="flex: 1;"></div>
    {{ templatesBar }}
    <button onClick="{{ openCleanView }}" style="display: inline-flex; align-items: center; gap: 5px; padding: 0 12px; height: 28px; border: none; background: #1a1a1a; color: #fff; font-size: 11px; font-family: inherit; cursor: pointer; border-radius: 3px; letter-spacing: 0.05em; font-weight: 500; flex-shrink: 0;">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2.5" width="10" height="7.5" rx="1"/><circle cx="6" cy="6.2" r="1.8"/></svg>
      Exporter
    </button>
  </div>

  {{ cleanOverlay }}
  {{ templatesManager }}

  <!-- body: canvas + right panel -->
  <div class="v2-body" style="flex: 1; min-height: 0; display: flex; position: relative;">

    <!-- canvas (full bleed gray) -->
    <div ref="{{ canvasRef }}" onMouseDown="{{ deselectAll }}" onMouseMove="{{ onCanvasMouseMove }}" class="v2-canvas-area" style="flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: default;">
      {{ framesMount }}
      {{ auraToast }}
      {{ bridgeAnimPanel }}
    </div>

    <!-- right panel: TYPE + FONDS tabs -->
    <div class="v2-right-panel {{ panelCollapsedClass }}" style="position: relative; width: {{ panelWidth }}; flex-shrink: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-left: 1px solid rgba(0,0,0,0.10); z-index: 20; display: flex; flex-direction: column;">

      <!-- collapse / expand toggle -->
      <button onClick="{{ togglePanel }}" title="{{ panelToggleTitle }}" style="position: absolute; top: 7px; left: 7px; z-index: 40; width: 26px; height: 26px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.9); color: #1a1a1a; font-size: 15px; line-height: 1; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; padding: 0;">{{ panelToggleIcon }}</button>

      <!-- width cycle -->
      <button onClick="{{ cyclePanelWidth }}" title="Élargir le panneau" style="position: absolute; top: 7px; left: 38px; z-index: 40; width: 26px; height: 26px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.9); color: #1a1a1a; font-size: 10px; font-weight: 600; line-height: 1; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; padding: 0;">{{ panelWidthLabel }}</button>

      <!-- inner content (hidden when collapsed) -->
      <div class="v2-panel-inner" style="display: {{ panelInnerDisplay }}; flex: 1; min-height: 0; flex-direction: column; width: 100%;">

      <!-- tab strip -->
      <div class="v2-tab-strip" style="display: flex; border-bottom: 1px solid rgba(0,0,0,0.10); flex-shrink: 0; padding-left: 70px;">
        <button onClick="{{ showTypePanel }}" style="flex: 1; padding: 10px 4px 8px; border: none; background: transparent; font-size: 10px; font-weight: 500; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; color: {{ typePanelFg }}; border-bottom: 2px solid {{ typePanelBorder }}; margin-bottom: -1px;">Type</button>
        <button onClick="{{ showFondsPanel }}" style="flex: 1; padding: 10px 4px 8px; border: none; background: transparent; font-size: 10px; font-weight: 500; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; color: {{ fondsPanelFg }}; border-bottom: 2px solid {{ fondsPanelBorder }}; margin-bottom: -1px;">Back</button>
        <button onClick="{{ showLayersPanel }}" style="flex: 1; padding: 10px 4px 8px; border: none; background: transparent; font-size: 10px; font-weight: 500; font-family: inherit; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; color: {{ layersPanelFg }}; border-bottom: 2px solid {{ layersPanelBorder }}; margin-bottom: -1px;">Layer</button>
      </div>

    <div class="v2-panel-scroll" style="flex: 1; overflow-y: auto; padding: 14px 12px 20px;">
      <div style="display: {{ typePanelDisplay }};">

      <!-- ═══ A-PONT — top, illustrated ═══ -->
      <div style="margin-bottom: 16px;">
        <div style="font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(0,0,0,0.4); margin-bottom: 8px;">A Pont</div>

        <!-- big visual A bridge — click to insert when a Main font is active -->
        <button onClick="{{ insertInlineA }}" title="Insérer au curseur" style="display: block; width: 100%; position: relative; height: 40px; background: #1a1a1a; border: none; border-radius: 4px; overflow: hidden; cursor: pointer; padding: 0;">
          <img src="uploads/a-pont-icon-white.png" alt="A pont" style="height: 18px; width: auto; display: block; margin: 0 auto;" />
        </button>
      </div>
      <!-- ═══ /A-PONT ═══ -->

      <div style="font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(0,0,0,0.3); margin-bottom: 6px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08);">Display</div>

      <!-- Main1 chip -->
      <button onClick="{{ applyMain1 }}" style="display: block; width: 100%; padding: 8px 10px 6px; margin-bottom: 5px; border: {{ main1Border }}; background: {{ main1Bg }}; border-radius: 3px; cursor: pointer; text-align: left; overflow: hidden;">
        <div style="font-family: 'obviously-variable', sans-serif; font-variation-settings: 'ital' 0, 'wght' 803, 'wdth' 121; font-size: 19px; line-height: 1; color: #1a1a1a; transform: scaleY(0.88); transform-origin: bottom left; display: block;">MAIN 1</div>
      </button>

      <!-- Main2 chip -->
      <button onClick="{{ applyMain2 }}" style="display: block; width: 100%; padding: 8px 10px 6px; margin-bottom: 5px; border: {{ main2Border }}; background: {{ main2Bg }}; border-radius: 3px; cursor: pointer; text-align: left; overflow: hidden;">
        <div style="font-family: 'obviously-variable', sans-serif; font-variation-settings: 'ital' 0, 'wght' 699, 'wdth' 121; font-size: 19px; line-height: 1; color: #1a1a1a; transform: scaleY(0.88); transform-origin: bottom left; display: block;">MAIN 2</div>
      </button>

      <!-- group label: Corps -->
      <div style="font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(0,0,0,0.3); margin-top: 11px; margin-bottom: 6px;">Corps</div>

      <!-- Corps 3 — Gras -->
      <button onClick="{{ applyCorps3 }}" style="display: block; width: 100%; padding: 7px 10px; margin-bottom: 5px; border: {{ corps3Border }}; background: {{ corps3Bg }}; border-radius: 3px; cursor: pointer; text-align: left; overflow: hidden;">
        <div style="font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.1; color: #1a1a1a;">Corps Gras</div>
      </button>

      <!-- Corps 2 — Regular -->
      <button onClick="{{ applyCorps2 }}" style="display: block; width: 100%; padding: 7px 10px; margin-bottom: 5px; border: {{ corps2Border }}; background: {{ corps2Bg }}; border-radius: 3px; cursor: pointer; text-align: left; overflow: hidden;">
        <div style="font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 400; font-size: 16px; line-height: 1.1; color: #1a1a1a;">Corps</div>
      </button>

      <!-- Corps 1 — Fin -->
      <button onClick="{{ applyCorps1 }}" style="display: block; width: 100%; padding: 7px 10px; margin-bottom: 5px; border: {{ corps1Border }}; background: {{ corps1Bg }}; border-radius: 3px; cursor: pointer; text-align: left; overflow: hidden;">
        <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; font-size: 16px; line-height: 1.1; color: #1a1a1a;">Corps Fin</div>
      </button>

      <!-- TAILLE -->
      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08);">
        <div style="font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(0,0,0,0.3); margin-bottom: 10px;">Taille</div>

        <!-- size presets: 3 groups -->
        <div style="display: grid; gap: 6px; margin-bottom: 10px;">

          <!-- Grand -->
          <div style="display: grid; grid-template-columns: 24px 1fr 1fr 1fr; align-items: center; gap: 4px;">
            <span style="font-size: 9px; color: rgba(0,0,0,0.28); letter-spacing: 0.06em;">G</span>
            <button onClick="{{ setSize72 }}" style="padding: 5px 0; border: {{ sz72Border }}; background: {{ sz72Bg }}; border-radius: 3px; cursor: pointer; font-size: 10px; font-family: inherit; color: {{ sz72Fg }}; text-align: center;" title="{{ sz72Title }}">72</button>
            <button onClick="{{ setSize96 }}" style="padding: 5px 0; border: {{ sz96Border }}; background: {{ sz96Bg }}; border-radius: 3px; cursor: pointer; font-size: 10px; font-family: inherit; color: {{ sz96Fg }}; text-align: center;" title="{{ sz96Title }}">96</button>
            <button onClick="{{ setSize128 }}" style="padding: 5px 0; border: {{ sz128Border }}; background: {{ sz128Bg }}; border-radius: 3px; cursor: pointer; font-size: 10px; font-family: inherit; color: {{ sz128Fg }}; text-align: center;" title="{{ sz128Title }}">128</button>
          </div>

          <!-- separator jump -->
          <div style="height: 1px; background: rgba(0,0,0,0.06); margin: 0 24px;"></div>

          <!-- Moyen -->

      React.createElement("button", {
        onClick: this.openInNewTab,
        title: "Ouvrir le rendu dans un nouvel onglet (clic droit → Enregistrer)",
        style: {
          display: "inline-flex", alignItems: "center", gap: "5px",
          padding: "0 12px", height: "28px", border: "1px solid rgba(255,255,255,0.3)",
          background: "transparent", color: "#fff", fontSize: "11px",
          fontFamily: "inherit", cursor: "pointer", borderRadius: "3px", whiteSpace: "nowrap",
        }
      },
        React.createElement("svg", { width: 11, height: 11, viewBox: "0 0 12 12", fill: "none", stroke: "currentColor", strokeWidth: 1.4, strokeLinecap: "round", strokeLinejoin: "round" },
          React.createElement("path", { d: "M4.5 2H2.5A0.5 0.5 0 002 2.5v7a0.5 0.5 0 00.5.5h7a0.5 0.5 0 00.5-.5v-2M7 2h3v3M10 2L5.5 6.5" })),
        "Nouvel onglet"
      ),
      React.createElement("button", {
        onClick: this.exportPng,
        title: "Télécharger un PNG (la largeur de police peut différer légèrement)",
        style: {
          padding: "0 12px", height: "28px", border: "1px solid rgba(255,255,255,0.3)",
          background: "transparent", color: "#fff", fontSize: "11px",
          fontFamily: "inherit", cursor: "pointer", borderRadius: "3px", whiteSpace: "nowrap",
        }
      }, "Télécharger PNG"),
      React.createElement("button", {
        onClick: this.exportVideo,
        title: "Enregistrer une vidéo de 10 s (fond animé + texte)",
        style: {
          padding: "0 12px", height: "28px", border: "1px solid rgba(255,255,255,0.3)",
          background: this.state.recording ? "rgba(232,168,124,0.25)" : "transparent",
          color: "#fff", fontSize: "11px",
          fontFamily: "inherit", cursor: this.state.recording ? "default" : "pointer", borderRadius: "3px", whiteSpace: "nowrap",
        }
      }, this.state.recording ? ("Enregistrement… " + this.state.recordPct + "%") : "Vidéo 10 s"),
      React.createElement("button", {
        onClick: this.toggleScreenRecord,
        title: "Enregistrer l'écran — capture la page LIVE (A-pont animé, shader, aura, vraie typo). Dans le sélecteur, choisis « Cet onglet ».",
        style: {
          padding: "0 12px", height: "28px", border: "1px solid rgba(255,255,255,0.3)",
          background: this.state.screenRecording ? "rgba(232,92,92,0.30)" : "transparent",
          color: "#fff", fontSize: "11px",
          fontFamily: "inherit", cursor: "pointer", borderRadius: "3px", whiteSpace: "nowrap",
        }
      }, this.state.screenRecording ? "⏹ Stop l'enreg." : "⏺ Rec écran"),
      React.createElement("button", {
        onClick: this.closeCleanView,
        style: {
          padding: "0 14px", height: "28px", border: "none",
          background: "#fff", color: "#1a1a1a", fontSize: "11px", fontWeight: 600,
          fontFamily: "inherit", cursor: "pointer", borderRadius: "3px", whiteSpace: "nowrap",
        }
      }, "Fermer")
    );

    return React.createElement("div", {
      onKeyDown: (e) => { if (e.key === "Escape") this.closeCleanView(); },
      style: {
        position: "fixed", inset: 0, zIndex: 9999,
        background: "#5a5a5a", overflow: "auto",
        display: "flex", flexDirection: "column",
      }
    },
      bar,
      React.createElement("div", {
        style: { flex: 1, display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "40px" }
      }, sizer)
    );
  }

  toggleScreenRecord = async () => {
    // Screen recording captures the LIVE page (A-pont animation, WebGL shader, aura, real
    // variable font) — everything html2canvas / drawImage cannot. No fidelity loss.
    if (this._screenRec && this._screenRec.state === "recording") { this._screenRec.stop(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      alert("Ton navigateur ne supporte pas l'enregistrement d'écran (getDisplayMedia).");
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false, preferCurrentTab: true });
    } catch (e) { return; } // user cancelled the picker
    // Fit the whole poster into view, then crop the self-capture to the artboard element
    // (Region Capture) so the recorded file is JUST the poster — no window chrome / margins.
    this.setState({ screenRecording: true });
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const track = stream.getVideoTracks()[0];
    let cropped = false;
    try {
      if (window.CropTarget && track && track.cropTo && this._cleanArtboard) {
        const ct = await window.CropTarget.fromElement(this._cleanArtboard);
        await track.cropTo(ct);
        cropped = true;
      }
    } catch (e) { cropped = false; }
    const mime = this._pickVideoMime();
    let rec;
    try { rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 }); }
    catch (e) { rec = new MediaRecorder(stream); }
    this._screenRec = rec;
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      try { stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      const ext = (mime.indexOf("mp4") >= 0) ? "mp4" : "webm";
      this._downloadBlob(new Blob(chunks, { type: mime }), this._videoFileName(this.state.format, ext));
      this._screenRec = null;
      this.setState({ screenRecording: false });
    };
    if (track) track.addEventListener("ended", () => { if (rec.state === "recording") rec.stop(); });
    rec.start();
    if (!cropped) console.warn("Region Capture (cropTo) indisponible — capture plein onglet, à recadrer.");
  };

  exportPng = () => {
    // the PNG is always rendered from the export view (native px, no editing chrome)
    if (!this.state.cleanView) this.openCleanView();
    this._ensureH2C()
      .then(() => this._cleanReady())
      .then(() => this._doExportPng())
      .catch((err) => {
        console.error(err);
        alert("Impossible de charger l'outil d'export (réseau ?). Réessaie.");
      });
  };

  _doExportPng = () => {
    const { pageLayout, format } = this.state;
    if (!pageLayout) { alert("Choisis un format d'abord."); return; }
    if (!this._cleanArtboard) { alert("Vue d'export indisponible. Réessaie."); return; }
    return window.html2canvas(this._cleanArtboard, {
      scale: 1,
      useCORS: true, allowTaint: true, onclone: this._h2cOnClone,
      backgroundColor: "#ffffff", logging: false,
      width: pageLayout.fmtW, height: pageLayout.fmtH,
      windowWidth: pageLayout.fmtW, windowHeight: pageLayout.fmtH,
    }).then((canvas) => this._download(canvas, format))
      .catch((err) => { console.error("Export PNG failed:", err); alert("Export PNG impossible. Utilise une capture d'écran."); });
  };

  _download = (canvas, format) => {
    const link = document.createElement("a");
    const fmt  = this.FORMATS.find(f => f.id === format);
    const name = (fmt && fmt.label ? fmt.label.replace(/[^a-z0-9]/gi, "-").toLowerCase() : "export") + "-" + Date.now() + ".png";
    link.download = name;
    link.href = canvas.toDataURL("image/png");
    link.click();
  };

  // ── 10s video export ──
  // Routes to WebCodecs (real MP4/H.264, social-ready) when available,
  // else falls back to MediaRecorder (WebM/MP4 depending on browser).
  _pickVideoMime() {
    const cands = ["video/mp4;codecs=h264", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    for (const m of cands) { try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
    return "video/webm";
  }

  exportVideo = () => {
    if (this.state.recording) return;
    const { pageLayout, format, bgColor } = this.state;
    if (!pageLayout) { alert("Choisis un format d'abord."); return; }
    if (!window.MediaRecorder && !window.VideoEncoder) { alert("Ton navigateur ne supporte pas l'enregistrement vidéo."); return; }

    if (!this.state.cleanView) this.openCleanView();
    this.setState({ recording: true, recordPct: 0 });
    this._ensureH2C()
      .then(() => this._cleanReady())
      .then(() => this._doExportVideo(pageLayout, format, bgColor))
      .catch((err) => { console.error(err); alert("Export vidéo impossible : " + (err && err.message)); this.setState({ recording: false }); });
  };

  _videoFileName(format, ext) {
    const fmt = this.FORMATS.find((f) => f.id === format);
    return (fmt && fmt.label ? fmt.label.replace(/[^a-z0-9]/gi, "-").toLowerCase() : "video") + "-" + Date.now() + "." + ext;
  }
  _downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // longest side of an exported video (H.264 levels stop around 4096 px wide; social video is
  // 1080×1920 at most) — big poster formats are scaled down, social formats are untouched
  VIDEO_MAX_SIDE = 2160;

  _doExportVideo = (pageLayout, format, bgColor) => {
    const outW = pageLayout.fmtW, outH = pageLayout.fmtH;
    const vs = Math.min(1, this.VIDEO_MAX_SIDE / Math.max(outW, outH));
    const even = (v) => Math.max(2, Math.round(v / 2) * 2);
    const vidW = even(outW * vs), vidH = even(outH * vs);
    const art = this._cleanArtboard;
    if (!art) { this.setState({ recording: false }); alert("Vue d'export indisponible. Réessaie."); return Promise.resolve(); }

    // STATIC layer = the export view itself (native px, export fonts), minus what moves:
    // shader / aura iframes and the page colour are hidden, they are composited live below.
    const anim = [...art.querySelectorAll(".v2-clean-anim")];
    anim.forEach((el) => { el._pv = el.style.visibility; el.style.visibility = "hidden"; });
    const prevBg = art.style.background;
    art.style.background = "transparent";
    const artRect = art.getBoundingClientRect();
    const fit = (artRect.width / outW) || 1;      // 1 unless the view is shrunk to fit

    // ── A-pont live layer ── reserve each ANIMATED bridge's slot (freeze it at its widest pe,
    // hide it in the snapshot) and record its geometry, so we redraw it ANIMATED on every
    // composite frame. Fast, one-click; the surrounding text stays put (no reflow, as agreed).
    const aBridges = [];
    const _bridgesHidden = [];
    this._exportFrozenBridges = new Set();
    try {
      const _anims = this.state.bridgeAnims || {};
      art.querySelectorAll(".v2-inline-bridge").forEach((b) => {
        const id = b.dataset.bridgeId, cfg = id && _anims[id];
        if (!cfg || !cfg.animate) return;
        this._exportFrozenBridges.add(id);
        const size = parseFloat(b.dataset.size) || 90;
        this.setBridgePeVisual(b, cfg.pe1);           // reserve the slot at the widest pe
        const svg = b.querySelector("svg") || b;
        const r = svg.getBoundingClientRect();
        const fr = b.closest("[data-clean-id]");
        const txt = fr && fr.firstElementChild;
        aBridges.push({
          nx: (r.left - artRect.left) / fit,
          ny: (r.top  - artRect.top)  / fit,
          sizeNative: size,
          drawH: r.height / fit,                      // includes the Main squish (scaleY 0.88)
          alpha: txt ? (parseFloat(getComputedStyle(txt).opacity) || 1) : 1,
          pe0: cfg.pe0, pe1: cfg.pe1, dur: cfg.dur,
          color: (svg.querySelector && svg.querySelector("path") && svg.querySelector("path").getAttribute("fill")) || getComputedStyle(b).color || "#000",
        });
        b._pvis = b.style.visibility;
        b.style.visibility = "hidden";
        _bridgesHidden.push(b);
      });
    } catch (e) {}

    const restore = () => {
      anim.forEach((el) => { el.style.visibility = el._pv || ""; });
      art.style.background = prevBg;
      _bridgesHidden.forEach((b) => { b.style.visibility = b._pvis || ""; });
      this._exportFrozenBridges = null;
    };

    return window.html2canvas(art, {
      scale: vs, width: outW, height: outH, windowWidth: outW, windowHeight: outH,
      backgroundColor: null, useCORS: true, allowTaint: true, logging: false, onclone: this._h2cOnClone,
    }).catch((e) => { restore(); throw e; }).then((textCanvas) => {
      restore();

      const auraCanvas   = (this._cleanAuraFrame   || this._auraFrame)   && ((this._cleanAuraFrame   || this._auraFrame).contentDocument)   && (this._cleanAuraFrame   || this._auraFrame).contentDocument.querySelector("#c");
      const shaderCanvas = (this._cleanShaderFrame || this._shaderFrame) && ((this._cleanShaderFrame || this._shaderFrame).contentDocument) && (this._cleanShaderFrame || this._shaderFrame).contentDocument.querySelector("#root canvas");

      const comp = document.createElement("canvas");
      comp.width = vidW; comp.height = vidH;
      const ctx = comp.getContext("2d");

      // ── Programmed virtual cursor to drive the auras during the recording ──
      // The aura PHYSICS is left strictly untouched: we only feed it a moving
      // cursor through the postMessage protocol it already supports, so the two
      // auras animate for the whole clip without any real mouse movement.
      // The cursor sweeps back-and-forth along an inclined axis. Angle (deg) and
      // number of sweeps are tweakable live via window.__auraExportAngleDeg /
      // window.__auraExportSweeps (defaults below).
      const _auraFrame = this._cleanAuraFrame || this._auraFrame;
      try { _auraFrame && _auraFrame.contentWindow && _auraFrame.contentWindow.postMessage({ type: "stage", value: 0 }, "*"); } catch (e) {}
      const _AURA_ANGLE  = (window.__auraExportAngleDeg != null ? window.__auraExportAngleDeg : 30) * Math.PI / 180;
      const _AURA_SWEEPS = (window.__auraExportSweeps  != null ? window.__auraExportSweeps  : 1.5);
      let _auraT0 = null;
      const driveAura = (nowMs) => {
        if (!_auraFrame || !_auraFrame.contentWindow) return;
        if (_auraT0 === null) _auraT0 = nowMs;
        const p  = Math.min(1, (nowMs - _auraT0) / 10000);          // clip progress 0..1
        const aw = _auraFrame.contentWindow.innerWidth  || outW;
        const ah = _auraFrame.contentWindow.innerHeight || outH;
        const s  = Math.sin(p * _AURA_SWEEPS * 2 * Math.PI);        // -1..1 back-and-forth
        const L  = 0.38 * Math.min(aw, ah);
        const x  = aw / 2 + s * L * Math.cos(_AURA_ANGLE);
        const y  = ah / 2 + s * L * Math.sin(_AURA_ANGLE);
        try { _auraFrame.contentWindow.postMessage({ type: "cursor", x: x, y: y }, "*"); } catch (e) {}
      };

      const draw = () => {
        driveAura(performance.now());
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, vidW, vidH);
        ctx.fillStyle = bgColor || "#ffffff"; ctx.fillRect(0, 0, vidW, vidH);
        try { if (shaderCanvas) ctx.drawImage(shaderCanvas, 0, 0, vidW, vidH); } catch (e) {}
        try { if (auraCanvas)   ctx.drawImage(auraCanvas,   0, 0, vidW, vidH); } catch (e) {}
        ctx.drawImage(textCanvas, 0, 0, vidW, vidH);
        // the A-ponts are positioned in native px
        ctx.scale(vidW / outW, vidH / outH);
        // live animated A-pont(s), redrawn into their reserved slots each frame
        if (aBridges.length) {
          const tSec = performance.now() / 1000;
          for (const b of aBridges) {
            const dur = Math.max(4, b.dur || 5);
            const phase = (tSec % (2 * dur)) / dur;
            const fr = phase < 1 ? phase : (2 - phase);
            const pe = b.pe0 + (b.pe1 - b.pe0) * fr;
            const vb = this.aViewBox(pe).split(" ").map(Number);
            const dispW = this.aBridgePxW(pe, b.sizeNative);
            const p2d = new Path2D(this.buildAPath(pe));
            ctx.save();
            ctx.globalAlpha = b.alpha != null ? b.alpha : 1;
            ctx.translate(b.nx, b.ny);
            ctx.scale(dispW / vb[2], (b.drawH || b.sizeNative) / 36.96);
            ctx.translate(-vb[0], 0);
            ctx.fillStyle = b.color;
            ctx.fill(p2d, "evenodd");
            ctx.restore();
          }
        }
      };

      if (window.VideoEncoder && window.VideoFrame) {
        return this._encodeWebCodecs(comp, draw, vidW, vidH, format)
          .catch((err) => { console.warn("WebCodecs failed, falling back:", err); return this._encodeMediaRecorder(comp, draw, format); });
      }
      return this._encodeMediaRecorder(comp, draw, format);
    });
  };

  // ── B: WebCodecs → real MP4/H.264 ──
  _encodeWebCodecs = async (comp, draw, outW, outH, format) => {
    let mp4;
    try { mp4 = await import("https://esm.sh/mp4-muxer@5.2.1"); }
    catch (e) { return this._encodeMediaRecorder(comp, draw, format); }
    const { Muxer, ArrayBufferTarget } = mp4;

    const fps = 30, DUR = 10000, total = Math.round(fps * DUR / 1000);
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({ target, fastStart: "in-memory", video: { codec: "avc", width: outW, height: outH } });
    const encoder = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => console.error("VideoEncoder:", e) });

    const candidates = ["avc1.640034", "avc1.4d0034", "avc1.640028", "avc1.4d0028", "avc1.42E01E"];
    let ok = false;
    for (const codec of candidates) {
      try {
        const sup = await VideoEncoder.isConfigSupported({ codec, width: outW, height: outH, bitrate: 12000000, framerate: fps });
        if (sup && sup.supported) { encoder.configure({ codec, width: outW, height: outH, bitrate: 12000000, framerate: fps }); ok = true; break; }
      } catch (e) {}
    }
    if (!ok) { return this._encodeMediaRecorder(comp, draw, format); }

    let i = 0;
    const t0 = performance.now();
    await new Promise((resolve) => {
      const tick = () => {
        const elapsed = performance.now() - t0;
        const want = Math.min(total, Math.floor(elapsed / 1000 * fps) + 1);
        while (i < want) {
          draw();
          const vf = new VideoFrame(comp, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
          encoder.encode(vf); vf.close();
          i++;
          const pct = Math.min(100, Math.round(i / total * 100));
          if (pct !== this.state.recordPct) this.setState({ recordPct: pct });
        }
        if (i < total) { this._recRAF = requestAnimationFrame(tick); } else resolve();
      };
      this._recRAF = requestAnimationFrame(tick);
    });
    await encoder.flush();
    muxer.finalize();
    this._downloadBlob(new Blob([target.buffer], { type: "video/mp4" }), this._videoFileName(format, "mp4"));
    this.setState({ recording: false, recordPct: 0 });
  };

  // ── A/fallback: MediaRecorder (WebM, or MP4 on Safari) ──
  _encodeMediaRecorder = (comp, draw, format) => {
    return new Promise((resolve) => {
      const stream = comp.captureStream(30);
      const mime = this._pickVideoMime();
      const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const ext = mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
        this._downloadBlob(new Blob(chunks, { type: mime }), this._videoFileName(format, ext));
        this.setState({ recording: false, recordPct: 0 });
        resolve();
      };
      const DUR = 10000, t0 = performance.now();
      const drawFrame = () => {
        const elapsed = performance.now() - t0;
        draw();
        const pct = Math.min(100, Math.round((elapsed / DUR) * 100));
        if (pct !== this.state.recordPct) this.setState({ recordPct: pct });
        if (elapsed < DUR) { this._recRAF = requestAnimationFrame(drawFrame); } else { rec.stop(); }
      };
      rec.start();
      this._recRAF = requestAnimationFrame(drawFrame);
    });
  };

  // ── formats ──
  FORMATS = [
    { id: "ig-post",     w: 1080, h: 1350,  label: "IG Post · 4:5"  },
    { id: "ig-square",   w: 1080, h: 1080,  label: "IG Carré · 1:1" },
    { id: "ig-story",    w: 1080, h: 1920,  label: "Story · 9:16"   },
    { id: "li-post",     w: 1200, h: 628,   label: "LinkedIn · 1.9:1" },
    { id: "li-portrait", w: 1080, h: 1350,  label: "LI Portrait"    },
    { id: "affiche-a4",  w: 2480, h: 3508,  label: "Affiche A4"     },
    { id: "affiche-a3",  w: 3508, h: 4961,  label: "Affiche A3"     },
    { id: "affiche-land",w: 4961, h: 3508,  label: "A3 Paysage"     },
    { id: "carre-40",    w: 4000, h: 4000,  label: "Carré 40×40"    },
  ];

  _editableRefs = {};
  _artboardEl   = null;

  // ── Geometry ──
  // Frames (x, y, w, h, fontSize, A-pont sizes) are stored in NATIVE px of the current
  // format. The screen only decides the zoom (pageLayout.scale) of the .v2-doc layer, so a
  // window resize or a panel change never touches the frames: nothing drifts, nothing reflows.
  _fmt(id) { return this.FORMATS.find((f) => f.id === (id || this.state.format)); }
  _layoutFor(fmt) {
    const el = this._canvasEl;
    const pad = 48;
    const cw = el ? el.clientWidth : 1000, ch = el ? el.clientHeight : 800;
    const scale = Math.max(0.02, Math.min((cw - pad * 2) / fmt.w, (ch - pad * 2) / fmt.h, 1));
    const w = fmt.w * scale, h = fmt.h * scale;
    return { x: (cw - w) / 2, y: (ch - h) / 2, w, h, scale, fmtW: fmt.w, fmtH: fmt.h };
  }
  // reference unit of the size buttons: a label "28" = 28 px when the page is shown 540 px wide
  // (≈ what the buttons gave before, on a normal screen) → 56 px natifs on a 1080 post.
  _sizeUnit(fmtW) { return (fmtW || (this._fmt() || { w: 1080 }).w) / 540; }
  // inner safe zone (max of all zones) in native px
  _safeInset(formatId) {
    return (this.SAFE_ZONES[formatId || this.state.format] || []).reduce((a, z) => ({
      l: Math.max(a.l, z.l), t: Math.max(a.t, z.t), r: Math.max(a.r, z.r), b: Math.max(a.b, z.b),
    }), { l: 0, t: 0, r: 0, b: 0 });
  }
  // screen zoom of an element (doc layer scale, fit-to-screen of the export view…)
  _zoomOf(el) {
    const host = el && (el.closest(".v2-editable, [data-clean-id] > div") || el);
    if (!host || !host.offsetWidth) return (this.state.pageLayout && this.state.pageLayout.scale) || 1;
    return (host.getBoundingClientRect().width / host.offsetWidth) || 1;
  }

  computePageLayout() {
    const fmt = this._fmt();
    if (!fmt || !fmt.w) { this.setState({ pageLayout: null, safeZones: [] }); return; }
    if (!this._canvasEl) return;
    const pl = this._layoutFor(fmt);
    const old = this.state.pageLayout;
    if (old && old.fmtW === pl.fmtW && old.fmtH === pl.fmtH &&
        Math.abs(old.x - pl.x) < 0.01 && Math.abs(old.y - pl.y) < 0.01 && Math.abs(old.scale - pl.scale) < 1e-6) return;
    const safeZones = (this.SAFE_ZONES[this.state.format] || []).map(z => ({
      ...z,
      left:   z.l * pl.scale, top:    z.t * pl.scale,
      right:  z.r * pl.scale, bottom: z.b * pl.scale,
    }));
    this.setState({ pageLayout: pl, safeZones });
  }

  // ── Format change ──
  // The composition is mapped from the old safe zone onto the new one: positions follow the
  // zone (anchored to the nearest edge or the centre), sizes scale uniformly by min(sx, sy)
  // so the text keeps the same line breaks and nothing that was apart can end up overlapping.
  // `_master` remembers the last composition you actually edited: switching formats back and
  // forth without editing always maps from it, so a round trip lands exactly where it started.
  _master = null;
  _mapFrames(frames, from, to) {
    // from / to: { id, w, h } (format id → its safe zone; unknown id → whole page)
    const area = (f) => {
      const i = f.id && this.SAFE_ZONES[f.id] ? this._safeInset(f.id) : { l: 0, t: 0, r: 0, b: 0 };
      const w = f.w - i.l - i.r, h = f.h - i.t - i.b;
      return (w > f.w * 0.3 && h > f.h * 0.3) ? { x: i.l, y: i.t, w, h } : { x: 0, y: 0, w: f.w, h: f.h };
    };
    const A = area(from), B = area(to);
    const sx = B.w / A.w, sy = B.h / A.h, k = Math.min(sx, sy);
    const r = (v) => Math.round(v * 100) / 100;
    const axis = (p, size, a0, aLen, b0, s) => {
      const q = p - a0;                               // position in the old zone
      const c = (q + size / 2) / aLen;
      const ns = size * k;
      if (c < 0.4) return b0 + q * s;                       // anchored to the start edge
      if (c > 0.6) return b0 + (q + size) * s - ns;         // anchored to the end edge
      return b0 + (q + size / 2) * s - ns / 2;              // centred
    };
    return frames.map((f) => {
      const p = { ...f };
      if (f.type === "a-bridge") {
        const size = f.size || 90, w = this.aBridgePxW(f.pe || 1, size);
        p.x = r(axis(f.x, w, A.x, A.w, B.x, sx)); p.y = r(axis(f.y, size, A.y, A.h, B.y, sy)); p.size = r(size * k);
        return p;
      }
      p.x = r(axis(f.x, f.w, A.x, A.w, B.x, sx));
      p.y = r(axis(f.y, f.h, A.y, A.h, B.y, sy));
      p.w = r(f.w * k); p.h = r(f.h * k);
      p.fontSize = r((f.fontSize || 16) * k);
      if (f.html) p.html = this._scaleBridgesInHtml(f.html, k);
      return p;
    });
  }
  changeFormat = (format) => {

    this._pushHistory();
    if (!this._master) this._master = { format: oldFmt.id, fmtW: oldFmt.w, fmtH: oldFmt.h, frames: this._liveFrames() };
    const m = this._master;
    const frames = (m.format === newFmt.id)
      ? m.frames.map((f) => ({ ...f }))
      : this._mapFrames(m.frames, { id: m.format, w: m.fmtW, h: m.fmtH }, newFmt);
    this.setState({ format, frames, selectedId: null }, () => {
      this.computePageLayout();
      this._syncEditablesFromState(true);
    });
  };

  // frames with the text as it is right now in the editables
  _liveFrames() {
    return this.state.frames.map((f) => {
      const el = this._editableRefs[f.id];
      return (el && f.type !== "a-bridge") ? { ...f, html: el.innerHTML } : { ...f };
    });
  }
  // write the state's html back into the editables (format mapping, undo, …)
  _syncEditablesFromState(recap) {
    this.state.frames.forEach((f) => {
      const el = this._editableRefs[f.id];
      if (!el || f.type === "a-bridge") return;
      const html = f.html || this._escHtml(f.text || "");
      if (el.innerHTML !== html) el.innerHTML = html;
      if (recap) el.querySelectorAll(".v2-inline-bridge").forEach((b) => this.setBridgePeVisual(b, parseFloat(b.dataset.pe) || 0.3));
    });
  }

  // ── Undo (⌘Z outside the text, or the ↶ button) ──
  // Snapshots are taken before every structural change (move, resize, add, delete, font,
  // size, colour, format, template) and before each typing session in a paragraph.
  _history = [];
  _redo = [];
  _snapshot() {
    const s = {};
    this.TEMPLATE_KEYS.forEach((k) => { s[k] = k === "frames" ? this._liveFrames() : this.state[k]; });
    return s;
  }
  _pushHistory(snap) {
    this._history.push(snap || this._snapshot());
    if (this._history.length > 50) this._history.shift();
    this._redo = [];
    if (!this.state.canUndo) this.setState({ canUndo: true });
  }
  _restore(snap) {
    const fmtChanged = snap.format !== this.state.format;
    this._master = null;
    const patch = { selectedId: null, selectedBridgeId: null };
    this.TEMPLATE_KEYS.forEach((k) => { if (k in snap) patch[k] = k === "frames" ? snap.frames.map((f) => ({ ...f })) : snap[k]; });
    this.setState(patch, () => {
      if (fmtChanged) this.computePageLayout();
      this._syncEditablesFromState(true);
    });
  }
  undo = () => {
    if (!this._history.length) return;
    this._redo.push(this._snapshot());
    this._restore(this._history.pop());
    this.setState({ canUndo: this._history.length > 0 });
  };
  redo = () => {
    if (!this._redo.length) return;
    this._history.push(this._snapshot());
    this._restore(this._redo.pop());
    this.setState({ canUndo: true });
  };

  componentDidMount() {

      // select the clicked bridge → opens the animation panel
      const anyBridge = e.target.closest(".v2-inline-bridge");
      if (anyBridge && anyBridge.dataset.bridgeId) {
        this.selectBridge(anyBridge);
      }

      // ── right handle → horizontal → pe (bridge extension) ──
      const extHandle = e.target.closest(".v2-bridge-ext-handle");
      if (extHandle) {
        e.preventDefault();
        const bridge  = extHandle.closest(".v2-inline-bridge");
        if (!bridge) return;
        const startPe = parseFloat(bridge.dataset.pe)   || 0.3;
        const startX  = e.clientX;
        const size    = parseFloat(bridge.dataset.size) || 20;
        const pxPerPe = (468.15 / 36.96) * size;          // native px per unit of pe
        const z       = this._zoomOf(bridge);             // screen px per native px
        let snapped   = false;
        const onMove  = (ev) => {
          if (!snapped) { snapped = true; this._pushHistory(); }
          const newPe = Math.max(0.02, Math.min(10, startPe + (ev.clientX - startX) / z / pxPerPe));
          bridge.dataset.pe = newPe;
          this.setBridgePeVisual(bridge, newPe);

        window.addEventListener("pointerup",   onUp);

      }

    this._animRAF = requestAnimationFrame(this._tickBridgeAnims);

    // load saved templates (PresetStore)

    this._escHandler = (e) => { if (e.key === "Escape" && this.state.cleanView) this.closeCleanView(); };
    window.addEventListener("keydown", this._escHandler);

    // Space cycles the aura stage: full → movement frozen → all frozen → full
    this._spaceHandler = (e) => {
      if (e.code !== "Space" && e.key !== " ") return;
      if (!this.state.auraOn) return;
      const a = document.activeElement;
      if (a && (a.isContentEditable || a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
      e.preventDefault();
      const next = (this.state.auraStage + 1) % 3;
      this.setState({ auraStage: next });

    // Inside a paragraph the browser keeps its own text undo.
    this._undoHandler = (e) => {
      if (!(e.metaKey || e.ctrlKey) || (e.key !== "z" && e.key !== "Z")) return;
      const a = document.activeElement;
      if (a && (a.isContentEditable || a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return;
      if (this.state.cleanView) return;
      e.preventDefault();
      if (e.shiftKey) this.redo(); else this.undo();
    };
    window.addEventListener("keydown", this._undoHandler);

    // seed the welcome paragraph with an A-pont in place of the "a" of "déplacer"
    // (once the paragraph is mounted and the fonts are there, to measure the cap height)
    let tries = 0;
    const seed = () => {
      const el = this._editableRefs["f1"];
      const f1 = this.state.frames.find(f => f.id === "f1");
      if (!f1 || f1.html) return;
      if (!el) { if (tries++ < 120) requestAnimationFrame(seed); return; }
      const size = this._capHeight(el, f1.fontSize || 56);
      const bridge = this.buildBridgeSpanHTML(0.3, size);
      const html = "éditer. élargir. dépl" + bridge + "cer";
      el.innerHTML = html;
      this.setState((s) => ({ frames: s.frames.map((f) => (f.id === "f1" ? { ...f, html } : f)) }));
    };

  // after each render: flag the paragraphs whose text goes past the page edge (cut in the export)
  componentDidUpdate() {

  }
  _checkOverflow() {
    const doc = this._docEl, pl = this.state.pageLayout, fmt = this._fmt();
    if (!doc || !pl || !fmt) return;
    const dr = doc.getBoundingClientRect();
    const z = pl.scale || 1;
    this.state.frames.forEach((f) => {
      const el = this._editableRefs[f.id];
      const fr = el && el.closest("[data-frame-id]");
      if (!fr) return;
      let out = false;
      if (el.firstChild) {
        const rg = document.createRange();
        rg.selectNodeContents(el);
        const r = rg.getBoundingClientRect();
        if (r.width || r.height) {
          const x0 = (r.left - dr.left) / z, y0 = (r.top - dr.top) / z;
          const x1 = (r.right - dr.left) / z, y1 = (r.bottom - dr.top) / z;
          out = x0 < -1 || y0 < -1 || x1 > fmt.w + 1 || y1 > fmt.h + 1;
        }
      }
      const v = out ? "true" : "false";
      if (fr.getAttribute("data-overflow") !== v) fr.setAttribute("data-overflow", v);

  componentWillUnmount() {

  // cap height (px, before any transform) of the font used in an editable, for A-pont sizing
  _capHeight(el, fallbackFs) {
    const cs = window.getComputedStyle(el);

    let size = Math.round(fs * 0.72 * 100) / 100;

      ctx.font = (cs.fontWeight || 400) + " " + fs + "px " + cs.fontFamily;
      const m = ctx.measureText("H");

    } catch (e) {}

    tmp.querySelectorAll(".v2-inline-bridge[data-bridge-id]").forEach((b) => {

      b.dataset.bridgeId = nid;

  }

  setBridgePeVisual(el, pe) {

    svg.setAttribute("width", String(this.aBridgePxW(usePe, size)));

  _tickBridgeAnims = () => {
    try {
      const anims = this.state.bridgeAnims || {};
      const ids = Object.keys(anims).filter((id) => anims[id] && anims[id].animate && !(this._exportFrozenBridges && this._exportFrozenBridges.has(id)));
      if (ids.length) {
        const now = performance.now() / 1000;
        const byId = {};
        const collect = (root) => { if (!root) return; root.querySelectorAll(".v2-inline-bridge").forEach((b) => {
          const bid = b.dataset.bridgeId; if (!bid) return;
          (byId[bid] || (byId[bid] = [])).push(b);

  renderBridgeAnimPanel() {

          React.createElement("span", { style: { fontSize: "11px", color: "rgba(0,0,0,0.45)", fontWeight: 500, fontVariantNumeric: "tabular-nums" } }, fmt(value))

        React.createElement("span", { style: { fontSize: "12px", fontWeight: 600, color: "#1a1a1a", flex: 1 } }, "Animer le A pont"),
        React.createElement("button", {

          style: { width: "22px", height: "22px", border: "1px solid rgba(0,0,0,0.12)", background: "#fff", color: "rgba(0,0,0,0.45)", fontSize: "13px", cursor: "pointer", borderRadius: "3px", padding: 0, lineHeight: 1 }
        }, "×")

        }

        React.createElement("span", { style: { flex: 1, textAlign: "left", fontSize: "11px", fontWeight: 600, color: "#1a1a1a" } }, "Animer ?"),
        React.createElement("span", {
          style: { width: "30px", height: "17px", borderRadius: "9px", flexShrink: 0, position: "relative", background: cfg.animate ? "#2D7CF0" : "rgba(0,0,0,0.18)", transition: "background 0.15s" }
        },

        )

      // controls
      slider("Position initiale", Math.min(cfg.pe0, maxPeR), 0.05, maxPeR, 0.01, (v) => this.setBridgeAnim({ pe0: Math.min(v, maxPeR) }), (v) => v.toFixed(2)),
      slider("Position maximale", Math.min(cfg.pe1, maxPeR), 0.05, maxPeR, 0.01, (v) => this.setBridgeAnim({ pe1: Math.min(v, maxPeR) }), (v) => v.toFixed(2)),
      slider("Temps", cfg.dur, 4, 12, 0.1, (v) => this.setBridgeAnim({ dur: v }), (v) => v.toFixed(1) + "s"),
      React.createElement("div", { style: { fontSize: "9px", color: "rgba(0,0,0,0.4)", fontStyle: "italic", lineHeight: 1.5 } },
        "Va-et-vient linéaire (pas d'ease). Blocage à la largeur dispo (" + maxPeR.toFixed(2) + ").")

  insertABridgeIntoFrame = (frameId) => {
    const el = this._editableRefs[frameId];
    if (!el) return;
    this._pushHistory();
    el.focus();
    const pe = 0.3; // sensible default; user adjusts by dragging after insert

    // Measure real cap-height using canvas.measureText — this API returns
    // actualBoundingBoxAscent = distance from baseline to top of "H" = cap-height.
    // This is pre-transform (not affected by scaleY on the parent, nor by the doc zoom),
    // which is exactly what we need for the SVG height attribute (native px).
    const size = this._capHeight(el);
    const vb   = this.aViewBox(pe);
    const path = this.buildAPath(pe);
    const w    = this.aBridgePxW(pe, size);

    const span = document.createElement("span");
    span.className = "v2-inline-bridge";
    span.setAttribute("contenteditable", "false");
    span.dataset.pe   = pe;
    span.dataset.size = size;
    span.dataset.bridgeId = this._nextBridgeId();

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width",  String(w));
    svg.setAttribute("height", String(size));
    svg.setAttribute("viewBox", vb);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.style.cssText = "display:block;color:inherit;overflow:visible;";
    const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pathEl.setAttribute("d", path);
    pathEl.setAttribute("fill", "currentColor");
    pathEl.setAttribute("fill-rule", "evenodd");
    svg.appendChild(pathEl);
    span.appendChild(svg);

    const dragHandle = document.createElement("span");
    dragHandle.className = "v2-bridge-ext-handle";
    span.appendChild(dragHandle);

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && el.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(span);
      range.setStartAfter(span);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      el.appendChild(span);
    }
    this.updateFrame(frameId, { html: el.innerHTML });
  };

  // ── A-pont helpers (ported from main.js buildPath) ──
  buildAPath(pc) {
    const r  = pc * 468.15;
    const ri = pc * 467.70;
    const xo = 234.065 * (1 - pc);
    const f  = (v) => (xo + v).toFixed(3);
    const g  = (v) => (xo + v + r).toFixed(3);
    const gi = (v) => (xo + v + ri).toFixed(3);
    return (
      `M${f(9.79)},0 L${f(6.02)},15.99 L${f(2.29)},29.91 ` +

      panelInnerDisplay: this.state.panelCollapsed ? "none" : "flex",
      panelToggleIcon: this.state.panelCollapsed ? "‹" : "›",
      panelToggleTitle: this.state.panelCollapsed ? "Afficher les panneaux" : "Masquer les panneaux",
      fondsPanel: this.renderFondsPanel(),
      bgControls: this.renderBgControls(),

      // color + opacity
      selColor:   sel ? (sel.color   || "#000000") : "#000000",
      selOpacity: sel ? (sel.opacity !== undefined ? sel.opacity : 100) : 100,
      setBlack:   colorOf("#000000"),
      setWhite:   colorOf("#ffffff"),
      onOpacityChange: (e) => {
        if (!sel) return;
        // one undo step per slider gesture
        const now = Date.now();
        if (!this._opacityT || now - this._opacityT > 1200) this._pushHistory();
        this._opacityT = now;
        this.updateFrame(sel.id, { opacity: parseFloat(e.target.value) });
      },
      isBlack: !sel || (sel.color || "#000000") === "#000000",
      isWhite:  sel && sel.color === "#ffffff",

      // preset size buttons (labels × format unit → native px)
      sz11Bg: isSz(11) ? "#1a1a1a" : "#fff",
      sz14Bg: isSz(14) ? "#1a1a1a" : "#fff",
      sz18Bg: isSz(18) ? "#1a1a1a" : "#fff",
      sz28Bg: isSz(28) ? "#1a1a1a" : "#fff",
      sz36Bg: isSz(36) ? "#1a1a1a" : "#fff",
      sz48Bg: isSz(48) ? "#1a1a1a" : "#fff",
      sz72Bg: isSz(72) ? "#1a1a1a" : "#fff",
      sz96Bg: isSz(96) ? "#1a1a1a" : "#fff",
      sz128Bg: isSz(128) ? "#1a1a1a" : "#fff",
      sz11Fg: isSz(11) ? "#fff" : "#1a1a1a",
      sz11Title: Math.round(11 * U) + " px sur le visuel",
      sz14Fg: isSz(14) ? "#fff" : "#1a1a1a",
      sz14Title: Math.round(14 * U) + " px sur le visuel",
      sz18Fg: isSz(18) ? "#fff" : "#1a1a1a",
      sz18Title: Math.round(18 * U) + " px sur le visuel",
      sz28Fg: isSz(28) ? "#fff" : "#1a1a1a",
      sz28Title: Math.round(28 * U) + " px sur le visuel",
      sz36Fg: isSz(36) ? "#fff" : "#1a1a1a",
      sz36Title: Math.round(36 * U) + " px sur le visuel",
      sz48Fg: isSz(48) ? "#fff" : "#1a1a1a",
      sz48Title: Math.round(48 * U) + " px sur le visuel",
      sz72Fg: isSz(72) ? "#fff" : "#1a1a1a",
      sz72Title: Math.round(72 * U) + " px sur le visuel",
      sz96Fg: isSz(96) ? "#fff" : "#1a1a1a",
      sz96Title: Math.round(96 * U) + " px sur le visuel",
      sz128Fg: isSz(128) ? "#fff" : "#1a1a1a",
      sz128Title: Math.round(128 * U) + " px sur le visuel",
      sz11Border: isSz(11) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz14Border: isSz(14) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz18Border: isSz(18) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz28Border: isSz(28) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz36Border: isSz(36) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz48Border: isSz(48) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz72Border: isSz(72) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz96Border: isSz(96) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      sz128Border: isSz(128) ? "1.5px solid #1a1a1a" : "1px solid rgba(0,0,0,0.12)",
      setSize11: setSz(11),
      setSize14: setSz(14),
      setSize18: setSz(18),
      setSize28: setSz(28),
      setSize36: setSz(36),
      setSize48: setSz(48),
      setSize72: setSz(72),
      setSize96: setSz(96),
      setSize128: setSz(128),
      selPe:   (sel && sel.type === "a-bridge") ? sel.pe.toFixed(2) : "",
      selSize: (sel && sel.type === "a-bridge") ? sel.size : "",
      onPeChange:   (e) => { if (sel && sel.type === "a-bridge") this.setPe(sel.id, e.target.value); },
      onSizeChange: (e) => { if (sel && sel.type === "a-bridge") this.setASize(sel.id, e.target.value); },
      // inline insert
      inlinePe: this.state.inlinePe.toFixed(2),
      onInlinePeChange: (e) => this.setState({ inlinePe: parseFloat(e.target.value) }),
      insertInlineA: () => { if (sel && sel.type !== "a-bridge") this.insertABridgeIntoFrame(sel.id); },
    };
  }
}
</script>
</body>
</html>
